sv:{overview:"RESCON är ett oberoende forskningskonsultföretag baserat i Borås, Sverige, som arbetar för datakvalitet och hälsojämlikhet inom life science, akademi och offentlig politik.\n\nVi är specialiserade på att utforma och genomföra rigorösa, nationella vetenskapliga enkätundersökningar som kartlägger sambandet mellan sociodemografiskt beteende och moderna sjukvårdssystem. Vårt huvudsakliga forskningsfokus är att belysa viktiga demografiska luckor i läkemedelsutveckling – särskilt allmänhetens kunskap, systematiska snedvridningar och patientsäkerhetsramverk för underrepresenterade och utsatta grupper (såsom gravida kvinnor, barn, äldre, personer med funktionsnedsättning och flyktingar).",
mission:"Att främja hälsojämlikhet, mångfald i kliniska prövningar och sociodemografisk forskning i Sverige.\n\nGenom högkvalitativ, etiskt utformad och makroaggregerad datainsamling överbryggar RESCON klyftan mellan läkemedelssäkerhetsstandarder, akademiska sociodemografiska insikter och evidensbaserade folkhälsoregler. Vi tillhandahåller det empiriska underlag som krävs för att bygga säkrare, mer representativa och inkluderande sjukvårdssystem för alla samhällsmedlemmar.",
svdesc:"RESCON är ett forskningskonsultföretag med FA-skatt under ledning av Professor Kutty Selva Nandakumar. Vi genomför en nationell enkätundersökning om folkhälsa, sociodemografiska trender och medicinsk jämlikhet i Sverige.",
facts:"Bransch: Forskningstjänster\nFöretagsstorlek: 11–50 anställda\nGrundat: 2023\nTyp: Egenägt\nHuvudkontor: Borås, Västra Götalands län\nArbetsplats: Hybrid, flexibel närvaro på plats\nPlatser: Sverige",
specs:"Mångfald i kliniska prövningar, Hälsojämlikhet, Folkhälsopolitik, Sociodemografisk forskning, Utformning av vetenskapliga enkäter, Läkemedelsforskning, Kvantitativ dataanalys",

avail:"Distans",pricing:"Kontakta oss för pris",svc:["Projektledning","Innehållsstrategi","Marknadsundersökning","Affärsrådgivning"]},
ta:{overview:"RESCON என்பது ஸ்வீடனின் போராஸ் (Borås) நகரை மையமாகக் கொண்ட ஒரு சுதந்திரமான ஆராய்ச்சி ஆலோசனை நிறுவனமாகும்; வாழ்க்கை அறிவியல், கல்வித்துறை மற்றும் பொதுக் கொள்கைத் துறைகளில் தரவுச் சிறப்பையும் சுகாதாரச் சமத்துவத்தையும் முன்னெடுப்பதே இதன் நோக்கம்.\n\nசமூக-மக்கள்தொகை நடத்தைக்கும் நவீன சுகாதார அமைப்புகளுக்கும் இடையிலான தொடர்பை வரைபடமாக்கும் கடுமையான, நாடு தழுவிய அறிவியல் கணக்கெடுப்புகளை வடிவமைத்து நடத்துவதில் நாங்கள் நிபுணத்துவம் பெற்றவர்கள். மருந்து உருவாக்கத்தில் உள்ள முக்கிய மக்கள்தொகை இடைவெளிகளை—குறிப்பாக பொது விழிப்புணர்வு, அமைப்பு சார்ந்த சார்புகள், மற்றும் குறைவாகப் பிரதிநிதித்துவம் பெற்ற, பாதிக்கப்படக்கூடிய மக்களை (கர்ப்பிணிப் பெண்கள், குழந்தைகள், முதியோர், மாற்றுத்திறனாளிகள், அகதிகள்) சுற்றியுள்ள நோயாளி பாதுகாப்பு கட்டமைப்புகளை—ஆய்வு செய்வது எங்கள் முதன்மை ஆராய்ச்சி கவனம்.",
mission:"ஸ்வீடன் முழுவதும் சுகாதாரச் சமத்துவம், மருத்துவப் பரிசோதனைகளில் பன்முகத்தன்மை மற்றும் சமூக-மக்கள்தொகை ஆராய்ச்சியை முன்னெடுத்தல்.\n\nஉயர்தரமான, நெறிமுறையுடன் வடிவமைக்கப்பட்ட, பெருந்தொகுப்புத் தரவு சேகரிப்பின் மூலம், மருந்துப் பாதுகாப்புத் தரநிலைகள், கல்வி சார்ந்த சமூக-மக்கள்தொகை நுண்ணறிவுகள் மற்றும் சான்றுகள் அடிப்படையிலான பொது சுகாதார விதிமுறைகளுக்கிடையிலான இடைவெளியை RESCON குறைக்கிறது. சமூகத்தின் அனைத்து உறுப்பினர்களுக்கும் பாதுகாப்பான, அனைவரையும் உள்ளடக்கிய சுகாதார அமைப்புகளை உருவாக்கத் தேவையான அனுபவ அடிப்படையை நாங்கள் வழங்குகிறோம்.",
svdesc:"RESCON என்பது பேராசிரியர் குட்டி செல்வ நந்தகுமார் தலைமையில் இயங்கும், F-வரி (FA-skatt) நிலை கொண்ட ஆராய்ச்சி ஆலோசனை நிறுவனமாகும். ஸ்வீடனில் பொது சுகாதாரம், சமூக-மக்கள்தொகைப் போக்குகள் மற்றும் மருத்துவச் சமத்துவம் குறித்த தேசிய அளவிலான கணக்கெடுப்பை நாங்கள் நடத்தி வருகிறோம்.",
facts:"தொழில்துறை: ஆராய்ச்சிச் சேவைகள்\nநிறுவன அளவு: 11–50 ஊழியர்கள்\nநிறுவப்பட்டது: 2023\nவகை: சுயசொந்தமானது\nதலைமையகம்: போராஸ், வெஸ்த்ரா யோத்தாலாந்து மாகாணம்\nபணியிடம்: கலப்பு முறை, நெகிழ்வான நேரடிப் பணி\nஇடங்கள்: ஸ்வீடன்",
specs:"மருத்துவப் பரிசோதனைப் பன்முகத்தன்மை, சுகாதாரச் சமத்துவம், பொது சுகாதாரக் கொள்கை, சமூக-மக்கள்தொகை ஆராய்ச்சி, அறிவியல் கணக்கெடுப்பு வடிவமைப்பு, மருந்தியல் ஆராய்ச்சி, அளவுசார் தரவுப் பகுப்பாய்வு",
atext:"மருத்துவ அழற்சி அறிவியலில் டோசென்ட் (Docent) மற்றும் RESCON தலைவர். ஆராய்ச்சி ஆர்வங்கள்: அழற்சி, நோயெதிர்ப்பியல், உயிர்வேதியியல், நுண்ணுயிரியல் மற்றும் தோல் மருத்துவம். hh.se இல் சரிபார்க்கப்பட்ட மின்னஞ்சல்.",
avail:"தொலைநிலை",pricing:"விலைக்கு எங்களைத் தொடர்பு கொள்ளவும்",svc:["திட்ட மேலாண்மை","உள்ளடக்க உத்தி","சந்தை ஆராய்ச்சி","வணிக ஆலோசனை"]}};

if(tab==="Content")h=F("overview","Overview",7)+F("mission","Mission",7)+F("facts","Company facts (one 'Label: value' per line)",7)+F("specs","Specialties (comma-separated)",4)+F("aname","Profile heading")+F("atext","Profile text",6)+U("photo","Profile photo");
if(tab==="News")h=S.news.map((n,i)=>`<div class="card" style="display:grid;gap:6px"><div><label>Title</label><input data-n="${i}" data-f="t" value="${esc(n.t)}"></div><div style="display:grid;grid-template-columns:140px 1fr;gap:6px"><div><label>Date</label><input type="date" data-n="${i}" data-f="d" value="${esc(n.d)}"></div><div><label>Link (optional)</label><input data-n="${i}" data-f="l" value="${esc(n.l)}"></div></div><div><label>Text</label><textarea rows="4" data-n="${i}" data-f="x">${esc(n.x)}</textarea></div><button class="btn d sm" data-dn="${i}" style="justify-self:start">Delete</button></div>`).join("")+`<button class="btn o" id="addn">+ Add post</button>`;
if(tab==="Team")h=S.team.map((m,i)=>`<div class="card" style="display:grid;gap:6px"><div><label>Name</label><input data-m="${i}" data-f="name" value="${esc(m.name)}"></div><div><label>Role / title</label><input data-m="${i}" data-f="role" value="${esc(m.role)}"></div><div><label>Biography</label><textarea rows="4" data-m="${i}" data-f="bio">${esc(m.bio)}</textarea></div><div><label>Expertise (comma-separated)</label><input data-m="${i}" data-f="expertise" value="${esc(m.expertise)}"></div><div><label>Email</label><input data-m="${i}" data-f="email" value="${esc(m.email)}"></div><div><label>Google Scholar URL</label><input data-m="${i}" data-f="scholar" value="${esc(m.scholar)}"></div><div><label>LinkedIn URL</label><input data-m="${i}" data-f="linkedin" value="${esc(m.linkedin)}"></div><div><label>Photo</label><input type="file" accept="image/*" data-upm="${i}">${m.photo?`<button class="btn d sm" data-clrm="${i}" style="margin-top:6px">Remove photo</button>`:""}</div><button class="btn d sm" data-dm="${i}" style="justify-self:start">Remove member</button></div>`).join("")+`<button class="btn o" id="addm">+ Add team member</button>`;
if(tab==="Services")h=F("svdesc","Services description",7)+F("avail","Availability")+F("pricing","Pricing")+S.services.map((x,i)=>`<div class="row"><input data-sv="${i}" value="${esc(x)}"><button class="btn d sm" data-dsv="${i}">Delete</button></div>`).join("")+`<button class="btn o" id="addsv">+ Add service</button>`;
if(tab==="Publications")h=S.pubs.map((p,i)=>`<div class="card" style="display:grid;gap:6px"><div><label>Title</label><input data-p="${i}" data-f="t" value="${esc(p.t)}"></div><div><label>Authors</label><input data-p="${i}" data-f="a" value="${esc(p.a)}"></div><div style="display:grid;grid-template-columns:90px 90px 1fr;gap:6px"><div><label>Cited by</label><input data-p="${i}" data-f="c" value="${esc(p.c)}"></div><div><label>Year</label><input data-p="${i}" data-f="y" value="${esc(p.y)}"></div><div><label>Journal / venue</label><input data-p="${i}" data-f="v" value="${esc(p.v)}"></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px"><div><label>Topic</label><input data-p="${i}" data-f="tp" value="${esc(p.tp)}"></div><div><label>Link (URL)</label><input data-p="${i}" data-f="l" value="${esc(p.l)}"></div></div><button class="btn d sm" data-dp="${i}" style="justify-self:start">Delete</button></div>`).join("")+`<button class="btn o" id="addp">+ Add publication</button>`;
$('pb').innerHTML=h;}
$('pb').addEventListener('input',e=>{const d=e.target.dataset;
if(d.k)S.s[d.k]=e.target.value;else if(d.sv!==undefined)S.services[d.sv]=e.target.value;else if(d.m!==undefined)S.team[d.m][d.f]=e.target.value;else if(d.n!==undefined)S.news[d.n][d.f]=e.target.value;else if(d.p!==undefined)S.pubs[d.p][d.f]=(d.f==="y"||d.f==="c")?(parseInt(e.target.value)||e.target.value):e.target.value;
view();});
$('pb').addEventListener('click',e=>{const d=e.target.dataset;let ch=true;
if(d.dsv!==undefined)S.services.splice(d.dsv,1);else if(d.dp!==undefined){if(confirm("Delete this publication?"))S.pubs.splice(d.dp,1);}
else if(d.clr)S.s[d.clr]="";else if(e.target.id==="addsv")S.services.push("New service");else if(d.dn!==undefined){if(confirm("Delete this post?"))S.news.splice(d.dn,1);}else if(e.target.id==="addn")S.news.unshift({t:"New post",d:new Date().toISOString().slice(0,10),x:"",l:""});
else if(d.dm!==undefined){if(confirm("Remove this team member?"))S.team.splice(d.dm,1);}else if(d.clrm!==undefined)S.team[d.clrm].photo="";else if(e.target.id==="addm")S.team.push({id:"t"+Date.now(),name:"New member",role:"",photo:"",bio:"",expertise:"",email:"",scholar:"",linkedin:""});else if(e.target.id==="addp")S.pubs.unshift({id:"p"+Date.now(),t:"New publication",a:"",c:0,y:new Date().getFullYear(),v:"",tp:"",l:""});else ch=false;
if(ch){view();form();}});
$('pb').addEventListener('change',async e=>{const k=e.target.dataset.up,m=e.target.dataset.upm;if(!(k||m!==undefined)||!e.target.files[0])return;
try{msg("Uploading…");const r=await upl(e.target.files[0]);if(m!==undefined)S.team[m].photo=r.url;else S.s[k]=r.url;view();form();msg("Uploaded. Click Save.")}catch(x){msg("Upload failed")}});
function msg(t){$('msg').textContent=t}
$('save').onclick=async()=>{try{msg("Saving…");const r=await api("/api/site",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(S)});msg(r.ok?"Saved ✓":r.status===401?"Session expired, log in again":"Save failed")}catch(x){msg("Server not reachable")}};
$('fab').onclick=()=>{$('panel').classList.add('open');form()};$('close').onclick=()=>$('panel').classList.remove('open');
async function api(path,opt={}){const hd=opt.headers||{};if(token)hd.Authorization="Bearer "+token;const r=await fetch(API+path,{...opt,headers:hd});if(r.status===401)setTok(null);return r}
function setTok(t){token=t;try{t?localStorage.setItem("rescon_token",t):localStorage.removeItem("rescon_token")}catch(e){}$('fab').style.display=t?"block":"none";if(!t)$('panel').classList.remove('open')}
async function upl(file){const fd=new FormData();fd.append("file",file);const r=await api("/api/upload",{method:"POST",body:fd});if(!r.ok)throw new Error("upload");return r.json()}
function openLogin(){$('login').hidden=false;$('le').focus()}
$('adminlink').onclick=e=>{e.preventDefault();if(token){$('panel').classList.add('open');form()}else openLogin()};
$('lcancel').onclick=()=>{$('login').hidden=true};
async function doLogin(){$('lmsg').textContent="…";try{const r=await fetch(API+"/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:$('le').value.trim(),password:$('lp').value})});if(!r.ok){$('lmsg').textContent=r.status===429?"Too many attempts, try later":"Wrong email or password";return}const j=await r.json();setTok(j.token);$('lp').value="";$('lmsg').textContent="";$('login').hidden=true;$('panel').classList.add('open');form()}catch(e){$('lmsg').textContent="Server not reachable"}}
$('lgo').onclick=doLogin;$('lp').onkeydown=e=>{if(e.key==="Enter")doLogin()};
$('logout').onclick=()=>setTok(null);
(async()=>{setTok(token);
try{const r=await fetch(API+"/api/site");if(r.ok){const x=await r.json();if(x&&x.s){S={s:{...DEF.s,...x.s},services:x.services||DEF.services,news:x.news||[],team:x.team||DEF.team,pubs:x.pubs||DEF.pubs};view();}}}catch(e){}
if(token){try{await api("/api/me")}catch(e){}}
})();
;
</script>
</body>
</html>
